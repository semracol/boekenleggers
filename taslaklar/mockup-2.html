<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup 2 - Happy Storybook</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg,#fffaf0,#ffe4e8);
      font-family: Georgia, serif;
      color: #2d241f;
    }
    .screen {
      width: 1200px;
      height: 760px;
      margin: 32px auto;
      background: linear-gradient(180deg,#fffdf8,#fff0e5);
      border: 1px solid #f7d8c0;
      box-shadow: 0 20px 46px rgba(255, 142, 114, 0.16);
      overflow: hidden;
      border-radius: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 22px 30px 18px;
      border-bottom: 1px solid #f5d8b7;
      background: rgba(255,255,255,.22);
    }
    .brand { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #ff6f61; }
    .nav { display: flex; gap: 22px; font-size: 14px; font-weight: 700; }
    .hero {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      padding: 28px 30px;
      gap: 18px;
      align-items: center;
    }
    .left {
      background: linear-gradient(135deg,#ffd8b4,#fff2be);
      height: 610px;
      border-radius: 24px;
      padding: 42px 26px;
      position: relative;
      overflow: hidden;
      border: 1px solid #f2d29d;
    }
    .left .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.52);
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .left h1 {
      font-size: 54px;
      line-height: 1;
      margin: 18px 0 18px;
      letter-spacing: -1px;
      color: #2d2d3d;
    }
    .left p {
      font-size: 18px;
      line-height: 1.6;
      color: #4b4957;
      max-width: 420px;
    }
    .left button {
      margin-top: 12px;
      border: none;
      background: linear-gradient(135deg,#ff6f61,#ffb05c);
      color: white;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 12px 22px rgba(255, 111, 97, 0.25);
    }
    .right {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      height: 100%;
    }
    .panel {
      background: linear-gradient(180deg,#fff9f1,#ffe7d9);
      border: 1px solid #f0c9ae;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }
    .panel:first-child { min-height: 300px; }
    .mock-bookmark {
      position: absolute;
      width: 120px;
      height: 280px;
      background: linear-gradient(180deg,#fffaf4,#ffdcc7);
      border-radius: 16px 16px 10px 10px;
      box-shadow: 0 16px 20px rgba(0,0,0,.12);
      border: 2px solid #edb287;
      top: 38px; left: 50%; transform: translateX(-50%) rotate(4deg);
    }
    .mock-bookmark::before {
      content: "";
      position: absolute;
      inset: 18px 16px 18px 16px;
      background: linear-gradient(180deg,#ffdfe3,#fff6eb);
      border-radius: 12px;
    }
    .bag {
      position: absolute;
      width: 180px;
      height: 220px;
      right: 26px; bottom: 18px;
      background: linear-gradient(180deg,#ffd6ae,#ffb996);
      border: 1px solid #fa9e7a;
      border-radius: 14px;
      transform: rotate(8deg);
      box-shadow: 0 12px 18px rgba(159, 90, 60, 0.15);
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">HAPPYBOOK</div>
      <div class="nav">
        <span>Çiçekler</span>
        <span>Masal</span>
        <span>Karakterler</span>
        <span>Hediye seti</span>
      </div>
    </div>

    <div class="hero">
      <div class="left">
        <div class="tag">YENİ KOLEKSİYON</div>
        <h1>Her sayfada küçük mutluluklar.</h1>
        <p>Renkli, sıcak ve samimi ayracılar. Her biri yumuşak bir hediye torbasında gelir.</p>
        <button>Keşfet</button>
      </div>
      <div class="right">
        <div class="panel">
          <div class="mock-bookmark"></div>
        </div>
        <div class="panel">
          <div class="bag"></div>
        </div>
        <div class="panel" style="grid-column: span 2; background: linear-gradient(180deg,#ffe4d0,#ffd0bf);">
          <div style="position:absolute;left:32px;top:36px;width:320px;">
            <h3 style="margin:0 0 8px;font-size:28px;color:#2b2d3a;">Hediye hazır paketler</h3>
            <p style="margin:0;color:#4d3e38;line-height:1.6;">Her ayracın yanında kurdele, kart ve yumuşak torba vardır.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
